data:
  train_ratio: 0.85                       # Ottimizzato per dataset piccolo: più dati per training
  test_ratio: 0.15                        # Meno dati per test, più per training
  data_dir: /root/dataset/dataset
  dataset_name: "Addresso"                # Cambiato per testare Addresso
  target_sample_rate: 16000
  target_sr: 16000                        # Alias per compatibilità
  fixed_duration: 5.0                     # Durata fissa per segmenti audio
  fixed_duration_s: 5.0                   # Alias per compatibilità
  mono: true                              # Converte audio in mono
  resample: true                          # Abilita resampling
  normalize: "peak"                       # Normalizzazione peak
  label_map:
    0: "cn"                               # Controllo normale
    1: "ad"                               # Alzheimer
  
  # Parametri specifici per Addresso (opzionali per altri dataset)
  addresso:
    use_segmentation: true      # Usa segmentazione CSV per Addresso
    target_speaker: "PAR"       # Filtra solo segmenti del partecipante
    min_segment_length_ms: 500  # Filtra segmenti troppo corti
    speaker_level_split: true   # Usa split a livello di speaker per evitare data leakage
    report_speaker_metrics: true # Riporta metriche aggregate per speaker

model:
  branch: "cnn"     # "classical_svm" | "classical_mlp" | "cnn" | "transformers_mlp"
  cnn:
    in_type: "waveform"                   # Usa spettrogrammi per velocità
    dropout: 0.6                             # Dropout molto alto per dataset piccolo
    batch_norm: true                         # Batch normalization per stabilità
    n_mels: 32                               # Ridotto per velocità su dataset piccolo
    n_fft: 256                               # Ridotto per velocità
    hop_length: 128                          # Ridotto per velocità
    log: true
    max_length: 16000                        # Ridotto per velocità (2 secondi a 8kHz)
  mlp:
    hidden_layers: [256, 128, 64]               # Ridotto da [256, 128, 64]: architettura più semplice e veloce
    dropout: 0.3                          # Ridotto da 0.2: meno dropout per training più veloce
    class_weight: "balanced"               # Mantiene bilanciamento classi
  svm:
    kernel: "rbf"                          # RBF per pattern non-lineari complessi
    C: 0.2                                 # REGOLARIZZAZIONE FORTE: previene overfitting mantenendo espressività
    gamma: 0.002                           # GAMMA BASSO: decisioni più generalizzabili
    class_weight: "balanced"               # Bilanciamento automatico classi
    probability: true                      # Abilita probabilità per metriche dettagliate

features:
  classical:
    n_mfcc: 13                             # Mantiene 13 coefficienti MFCC (essenziali)
    mfcc_delta: true                       # Delta features (importanti per dinamica)
    mfcc_delta2: false                     # Disabilitato: riduce complessità
    chroma: false                          # Disabilitato: non critico per Alzheimer
    spectral_centroid: true                # Centro spettrale (importante)
    spectral_bandwidth: false              # Disabilitato: riduce features
    spectral_rolloff: false                # Disabilitato: non essenziale
    zero_crossing_rate: true               # Tasso attraversamento zero (veloce e utile)
    rms_energy: true                       # Energia RMS (essenziale)
    tempo: false                           # Disabilitato: calcolo lento
    tonnetz: false                         # Disabilitato: features complesse lente
    poly_features: false                   # Disabilitato: caratteristiche ritmiche lente
    spectral_contrast_enhanced: false      # Disabilitato: contrasto spettrale complesso
    pitch: false                           # Disabilitato: puo causare errori su alcuni audio
    jitter_shimmer: false                  # Disabilitato: richiede Parselmouth stabil  spectrogram:
    log: true
  transformers:
    model_name: "ALM/hubert-base-audioset"        
    pooling: "mean"                             # "cls" | "mean"
    freeze_backbone: false                      # Unfreeze per fine-tuning completo
    max_length: 32000                          # Ridotto da 48000 per dataset piccolo (2s * 16kHz)
    layer: -1                                  # Usa ultimo layer per rappresentazioni migliori
                                                # Modelli disponibili:
                                                # - facebook/wav2vec2-base-960h
                                                # - ALM/wav2vec2-base-audioset
                                                # - facebook/hubert-base-ls960
                                                # - ALM/hubert-base-audioset
                                                # - microsoft/wavlm-base-plus
                                                # - microsoft/wavlm-base

training:
  epochs: 10                               # Drasticamente ridotto per dataset piccolo (~2268 campioni)
  batch_size: 16                           # Ridotto ulteriormente per dataset piccolo
  lr: 0.0005                               # Molto più basso per evitare overfitting rapido
  max_lr: 0.002                            # Ridotto per stabilità su dataset piccolo
  min_lr: 0.00001                          # LR minimo molto basso
  warmup_ratio: 0.2                        # Warmup più lungo per dataset piccolo
  weight_decay: 0.05                       # Regolarizzazione molto forte per dataset piccolo
  checkpoint_dir: checkpoints/
  model_name: best_model
  device: "cuda"                           # cpu | cuda | mps
  evaluation_metric: accuracy
  best_metric_lower_is_better: false
  seed: 42  
  # Validation Split
  val_split: 0.3                           # Aumentato per dataset piccolo (migliore validazione)

plot: [accuracy, loss]